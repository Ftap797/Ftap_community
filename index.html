<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTAP CIS Community — PvP Clans & Gamepasses</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            line-height: 1.5;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .discord-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            transform: translateY(0);
            background: linear-gradient(135deg, #1e1a3a, #2a1a4a, #1a0a3a);
            background-size: 200% 200%;
            border-radius: 0 0 20px 20px;
            padding: 0.8rem 2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px #6d28d9 inset, 0 0 15px rgba(109, 40, 217, 0.5);
            z-index: 1001;
            font-size: 1rem;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            animation: darkPurplePulse 3s ease infinite, borderGlow 2s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .discord-banner:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), 0 0 0 2px #c084fc inset, 0 0 25px #a855f7;
            background: linear-gradient(135deg, #2a1a4a, #3a1a5a, #2a1a4a);
            background-size: 200% 200%;
        }

        @keyframes darkPurplePulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes borderGlow {
            0% { box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px #6d28d9 inset, 0 0 15px rgba(109, 40, 217, 0.4); }
            50% { box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 0 1px #c084fc inset, 0 0 25px rgba(192, 132, 252, 0.7); }
            100% { box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px #6d28d9 inset, 0 0 15px rgba(109, 40, 217, 0.4); }
        }

        .discord-banner a {
            color: white;
            text-decoration: none;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #a855f7;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(2px);
            border-radius: 1.5rem;
            padding: 2rem;
            margin-top: 100px;
            border: 1px solid rgba(139, 92, 246, 0.5);
            position: relative;
            z-index: 10;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        .lang-switch {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .lang-btn {
            background: rgba(109, 40, 217, 0.5);
            border: 1px solid #a855f7;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            cursor: pointer;
            color: #ffffff;
            transition: 0.2s;
            font-weight: 600;
        }

        .lang-btn.active {
            background: #6d28d9;
            border-color: #c084fc;
            color: white;
            box-shadow: 0 0 10px #6d28d9;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #c084fc, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            text-align: center;
            text-shadow: 0 0 20px rgba(109, 40, 217, 0.3);
        }

        .subhead {
            color: #d1d5db;
            text-align: center;
            margin: 1rem 0 2rem 0;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #6d28d9;
            padding-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #8b5cf6;
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: #6d28d9;
            border-color: #c084fc;
            color: white;
            box-shadow: 0 0 15px #6d28d9;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 1.5rem 0 1rem 0;
            letter-spacing: -0.3px;
            text-align: center;
            background: linear-gradient(90deg, 
                #e9d5ff 0%, 
                #d8b4fe 15%, 
                #c084fc 30%, 
                #a855f7 50%, 
                #c084fc 70%, 
                #d8b4fe 85%, 
                #e9d5ff 100%);
            background-size: 250% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: discordShimmer 6s ease infinite;
        }

        @keyframes discordShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .gamepass-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }

        .gamepass-item {
            background: rgba(109, 40, 217, 0.25);
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid #8b5cf6;
            transition: 0.2s;
        }

        .gamepass-item:hover {
            background: rgba(109, 40, 217, 0.45);
            border-color: #c084fc;
            transform: translateY(-2px);
        }

        .gamepass-name {
            font-weight: 800;
            font-size: 1rem;
            display: block;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .gamepass-price {
            color: #c084fc;
            font-size: 0.9rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            display: inline-block;
        }

        .top-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin: 1rem 0;
        }

        .top-item {
            display: flex;
            align-items: center;
            padding: 0.7rem 1rem;
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0a0a1a);
            background-size: 200% 200%;
            border-radius: 0.8rem;
            flex-wrap: wrap;
            border: 1px solid #6d28d9;
            animation: darkPurpleFlow 8s ease infinite;
            transition: all 0.2s;
        }

        .top-item:hover {
            border-color: #c084fc;
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
        }

        @keyframes darkPurpleFlow {
            0% { background-position: 0% 50%; background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0a0a1a); }
            33% { background-position: 100% 50%; background: linear-gradient(135deg, #1a0a2e, #2a0a3e, #0a0a1a); }
            66% { background-position: 50% 100%; background: linear-gradient(135deg, #0d0d20, #1f0a35, #0d0d20); }
            100% { background-position: 0% 50%; background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0a0a1a); }
        }

        .top-rank {
            font-weight: 800;
            color: #c084fc;
            width: 50px;
            font-size: 1rem;
        }

        .top-name {
            font-weight: 700;
            color: #ffffff;
            flex: 1;
            font-size: 1rem;
        }

        .top-status {
            color: #e2e8f0;
            font-size: 0.8rem;
            line-height: 1.45;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.3rem 0.7rem;
            border-radius: 1rem;
            margin-top: 0.2rem;
            width: 100%;
            word-break: break-word;
            white-space: normal;
        }

        .clan-info {
            color: #e2e8f0;
            font-size: 0.8rem;
            line-height: 1.45;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.3rem 0.7rem;
            border-radius: 1rem;
            margin-top: 0.2rem;
            width: 100%;
            word-break: break-word;
            white-space: normal;
        }

        .news-message {
            background: rgba(109, 40, 217, 0.2);
            border: 1px solid #8b5cf6;
            border-radius: 1.2rem;
            padding: 2rem;
            text-align: center;
            margin: 1rem 0;
        }

        .news-message p {
            font-size: 1.1rem;
            color: #e2e8f0;
            margin-bottom: 0.8rem;
        }

        .news-message .lazy-sign {
            font-style: italic;
            color: #c084fc;
            font-size: 0.9rem;
        }

        footer {
            display: none;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
                margin-top: 120px;
            }
            .discord-banner {
                padding: 0.5rem 1rem;
                font-size: 0.75rem;
            }
            .top-rank {
                width: 40px;
            }
            .top-status {
                margin-top: 6px;
            }
            .top-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .news-message p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

<canvas id="spaceCanvas"></canvas>

<div class="discord-banner" id="discordBanner">
    <a href="#" id="discordLink">Official Discord Server FTAP</a>
</div>

<div class="container">
    <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru">Русский</button>
        <button class="lang-btn" data-lang="en">English</button>
    </div>

    <h1 id="siteTitle">FTAP Community</h1>
    <div class="subhead" id="siteSubhead">All-Time Tops · Gamepasses · PvP Clans · HVH · AIM · News</div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="home" id="tabHome">Главная</button>
        <button class="tab-btn" data-tab="news" id="tabNews">Новости FTAP</button>
    </div>

    <div id="home" class="tab-content active">
        <h2 id="gamepassesTitle">GAMEPASSES</h2>
        <div class="gamepass-grid" id="gamepassGrid"></div>

        <h2 id="allTimeTopTitle">ALL-TIME TOP</h2>
        <div class="top-list" id="allTimeTopList"></div>

        <h2 id="topCisTitle">TOP CIS RIGHT NOW</h2>
        <div class="top-list" id="topCisList"></div>

        <h2 id="topCodersTitle">TOP CODERS</h2>
        <div class="top-list" id="topCodersList"></div>

        <h2 id="topClansTitle">TOP CLANS PVP</h2>
        <div class="top-list" id="topClansList"></div>

        <h2 id="clansHvhTitle">TOP CLANS HVH</h2>
        <div class="top-list" id="clansHvhList"></div>

        <h2 id="hvhTitle">TOP HVH</h2>
        <div class="top-list" id="hvhList"></div>

        <h2 id="aimTitle">TOP AIM PLAYERS</h2>
        <div class="top-list" id="aimList"></div>
    </div>

    <div id="news" class="tab-content">
        <div class="news-message" id="newsMessage">
            <p id="newsText">Друн друк.</p>
            <div class="lazy-sign" id="lazySignature">— БЭЭЭ</div>
        </div>
    </div>

    <footer id="footerText"></footer>
</div>

<script>
    (function() {
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        let movingParticles = [];
        let twinklingStars = [];
        const PARTICLE_COUNT = 220;
        const STAR_COUNT = 800;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function initUniverse() {
            movingParticles = [];
            twinklingStars = [];
            
            for (let i = 0; i < STAR_COUNT; i++) {
                twinklingStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.8 + 0.3,
                    baseAlpha: Math.random() * 0.5 + 0.15,
                    alpha: Math.random() * 0.5 + 0.15,
                    speed: 0.003 + Math.random() * 0.015,
                    direction: Math.random() > 0.5 ? 1 : -1
                });
            }
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                movingParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2.5 + 0.6,
                    vx: (Math.random() - 0.5) * 0.18,
                    vy: (Math.random() - 0.5) * 0.12,
                    hue: 240 + Math.random() * 80,
                    sat: 65 + Math.random() * 25,
                    light: 55 + Math.random() * 25,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }
        }

        function drawCosmos() {
            ctx.clearRect(0, 0, width, height);
            
            const radialGrad = ctx.createRadialGradient(width * 0.3, height * 0.2, 50, width * 0.5, height * 0.5, width);
            radialGrad.addColorStop(0, '#0f0a2a');
            radialGrad.addColorStop(0.4, '#0a0520');
            radialGrad.addColorStop(1, '#030010');
            ctx.fillStyle = radialGrad;
            ctx.fillRect(0, 0, width, height);
            
            for (let star of twinklingStars) {
                star.alpha += star.speed * star.direction;
                if (star.alpha > star.baseAlpha + 0.25) star.direction = -1;
                if (star.alpha < star.baseAlpha - 0.12) star.direction = 1;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(210, 190, 255, ${star.alpha * 0.7})`;
                ctx.fill();
            }
            
            for (let p of movingParticles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${p.alpha * 0.6})`;
                ctx.fill();
                
                if (p.radius > 1.2) {
                    ctx.beginPath();
                    ctx.arc(p.x - 0.8, p.y - 0.5, p.radius * 0.4, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, 70%, ${p.alpha * 0.4})`;
                    ctx.fill();
                }
                
                p.x += p.vx;
                p.y += p.vy;
                
                if (p.x > width + 30) p.x = -30;
                if (p.x < -30) p.x = width + 30;
                if (p.y > height + 30) p.y = -30;
                if (p.y < -30) p.y = height + 30;
            }
            
            requestAnimationFrame(drawCosmos);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initUniverse();
        });
        
        resizeCanvas();
        initUniverse();
        drawCosmos();

        let currentLang = 'ru';

        const gamepassesList = [
            { name: "Farther Reach", price: "225 Robux" },
            { name: "Multi-Color Line", price: "45 Robux" },
            { name: "Escape Faster", price: "135 Robux" },
            { name: "Infinite House Time", price: "60 Robux" },
            { name: "More House Saves", price: "60 Robux" },
            { name: "Raised Toys Limit", price: "225 Robux" },
            { name: "Earn More Coins", price: "225 Robux" }
        ];

        const allTimeTop = ["Markakela", "Keenawareeness", "Lal", "Reflex", "Rellizeez", "Welosew", "Flintex", "Meow", "Lensor", "Drezz", "Derealization", "Centurion"];
        
        const topCisPlayers = ["Reflex", "Keenawareeness", "Rellizeez", "Welosew", "Lorex"];
        
        const topCoders = [
            { name: "m1kp", statusRu: "m1kp создал всеми известный скрипт Worst — топ-1 скрипт по мнению опытных кодеров.", statusEn: "m1kp created the famous Worst script — top-1 script according to experienced coders." },
            { name: "Blizt", statusRu: "Blizt — создатель скрипта Blizt. Есть премиум и бесплатная версия.", statusEn: "Blizt — creator of Blizt script. Premium and free versions available." },
            { name: "Tapalka", statusRu: "Опытный разработчик на Python, LuaU, Go, Java и C#.", statusEn: "Experienced developer in Python, LuaU, Go, Java and C#." },
            { name: "marshel", statusRu: "Маршел — создатель качественного скрипта Resonance.", statusEn: "Marshel — creator of the high-quality Resonance script." },
            { name: "Sladostrastnik", statusRu: "Грек, очень опытный скриптер (LuaU, Python). Лидер SEB - EGA.", statusEn: "Greek, very experienced scripter (LuaU, Python). Leader of SEB - EGA." }
        ];

        const pvpClans = [
            { name: "SHX", infoRu: "1 место. Клан имеет сильнейших на данный момент игроков: LortFaeky, Krot, Keenawareness, Reflex.", infoEn: "1st place. The clan has the strongest players right now: LortFaeky, Krot, Keenawareness, Reflex." },
            { name: "KoJ", infoRu: "2 место. Клан имеет топовых FTAP игроков СНГ: Desper, Centurion, Derealization.", infoEn: "2nd place. The clan has top CIS FTAP players: Desper, Centurion, Derealization." },
            { name: "DIN", infoRu: "3 место. Этот клан может доставить вам неприятности — у них есть сильные игроки по PvP и HVH.", infoEn: "3rd place. This clan can cause you trouble — they have strong PvP and HVH players." }
        ];

        const clansHvhList = [
            { name: "PDD" },
            { name: "URAL" },
            { name: "AV" },
            { name: "EGA" },
            { name: "SEB" }
        ];

        const hvhPlayers = [
            { name: "Luke", statusRu: "Сильный HVH игрок с Mercury, Resonance.", statusEn: "Strong HVH player with Mercury, Resonance." },
            { name: "Onlylose", statusRu: "Один из лидеров PDD, создатель скрипта Onlylose.", statusEn: "One of the leaders of PDD, creator of Onlylose script." },
            { name: "Tapalka", statusRu: "Топовый HVH игрок с самописными скриптами Menaton, Grape.", statusEn: "Top HVH player with self-written scripts Menaton, Grape." },
            { name: "Krasher", statusRu: "Участник URAL, создал скрипт RIP, входит в топ-3 HVH игроков URAL.", statusEn: "Member of URAL, creator of RIP script, top-3 HVH player in URAL." },
            { name: "Dominus", statusRu: "Участник клана URAL, очень силён в HVH, входит в топ-3 лучших HVH игроков URAL.", statusEn: "Member of URAL clan, very strong in HVH, top-3 HVH players in URAL." }
        ];

        const aimPlayers = [
            { name: "Lort Faeky", statusRu: "Лучший аим в Roblox в целом, нечеловеческая реакция.", statusEn: "The best aim in Roblox overall, inhuman reaction." },
            { name: "Krot", statusRu: "Друг Lort Faeky, также обладает невероятными способностями.", statusEn: "Lort Faeky's friend, also has incredible abilities." },
            { name: "Beastmode", statusRu: "Очень сильный игрок, состоит в клане SHX, помогает Lort и Krot.", statusEn: "Very strong player, member of SHX clan, helps Lort and Krot." }
        ];

        function renderGamepasses() {
            const container = document.getElementById('gamepassGrid');
            if (container) {
                container.innerHTML = gamepassesList.map(gp => `
                    <div class="gamepass-item">
                        <span class="gamepass-name">${escapeHtml(gp.name)}</span>
                        <span class="gamepass-price">${escapeHtml(gp.price)}</span>
                    </div>
                `).join('');
            }
        }

        function renderAllTimeTop() {
            const container = document.getElementById('allTimeTopList');
            if (container) {
                container.innerHTML = allTimeTop.map((p, i) => `<div class="top-item"><div class="top-rank">${i+1}</div><div class="top-name">${escapeHtml(p)}</div></div>`).join('');
            }
        }
        
        function renderTopCis() {
            const container = document.getElementById('topCisList');
            if (container) {
                container.innerHTML = topCisPlayers.map((p, i) => `<div class="top-item"><div class="top-rank">${i+1}</div><div class="top-name">${escapeHtml(p)}</div></div>`).join('');
            }
        }
        
        function renderTopCoders() {
            const container = document.getElementById('topCodersList');
            if (container) {
                container.innerHTML = topCoders.map((c, i) => `
                    <div class="top-item">
                        <div class="top-rank">${i+1}</div>
                        <div class="top-name">${escapeHtml(c.name)}</div>
                        <div class="top-status">${currentLang === 'ru' ? c.statusRu : c.statusEn}</div>
                    </div>
                `).join('');
            }
        }

        function renderTopClans() {
            const container = document.getElementById('topClansList');
            if (container) {
                container.innerHTML = pvpClans.map((clan, idx) => `
                    <div class="top-item">
                        <div class="top-rank">${idx+1}</div>
                        <div class="top-name">${escapeHtml(clan.name)}</div>
                        <div class="clan-info">${currentLang === 'ru' ? clan.infoRu : clan.infoEn}</div>
                    </div>
                `).join('');
            }
        }

        function renderClansHvh() {
            const container = document.getElementById('clansHvhList');
            if (container) {
                container.innerHTML = clansHvhList.map((clan, idx) => `
                    <div class="top-item">
                        <div class="top-rank">${idx+1}</div>
                        <div class="top-name">${escapeHtml(clan.name)}</div>
                    </div>
                `).join('');
            }
        }

        function renderHvh() {
            const container = document.getElementById('hvhList');
            if (container) {
                container.innerHTML = hvhPlayers.map((p, i) => `
                    <div class="top-item">
                        <div class="top-rank">${i+1}</div>
                        <div class="top-name">${escapeHtml(p.name)}</div>
                        <div class="top-status">${currentLang === 'ru' ? p.statusRu : p.statusEn}</div>
                    </div>
                `).join('');
            }
        }

        function renderAim() {
            const container = document.getElementById('aimList');
            if (container) {
                container.innerHTML = aimPlayers.map((p, i) => `
                    <div class="top-item">
                        <div class="top-rank">${i+1}</div>
                        <div class="top-name">${escapeHtml(p.name)}</div>
                        <div class="top-status">${currentLang === 'ru' ? p.statusRu : p.statusEn}</div>
                    </div>
                `).join('');
            }
        }

        function updateNewsMessage() {
            const newsTextEl = document.getElementById('newsText');
            const lazySignEl = document.getElementById('lazySignature');
            if (newsTextEl && lazySignEl) {
                if (currentLang === 'ru') {
                    newsTextEl.innerHTML = 'Друн друк.';
                    lazySignEl.innerHTML = '— БЭЭЭ';
                } else {
                    newsTextEl.innerHTML = 'Drun druk.';
                    lazySignEl.innerHTML = '— BEEE';
                }
            }
        }

        const translations = {
            ru: {
                siteTitle: 'FTAP CIS Community',
                siteSubhead: 'All-Time Tops · Gamepasses · PvP Clans · HVH · AIM · News',
                gamepassesTitle: 'GAMEPASSES',
                allTimeTopTitle: 'ALL-TIME TOP',
                topCisTitle: 'TOP CIS RIGHT NOW',
                topCodersTitle: 'TOP CODERS',
                topClansTitle: 'TOP CLANS PVP',
                clansHvhTitle: 'TOP CLANS HVH',
                hvhTitle: 'TOP HVH',
                aimTitle: 'TOP AIM PLAYERS',
                tabHome: 'Главная',
                tabNews: 'Новости FTAP'
            },
            en: {
                siteTitle: 'FTAP CIS Community',
                siteSubhead: 'All-Time Tops · Gamepasses · PvP Clans · HVH · AIM · News',
                gamepassesTitle: 'GAMEPASSES',
                allTimeTopTitle: 'ALL-TIME TOP',
                topCisTitle: 'TOP CIS RIGHT NOW',
                topCodersTitle: 'TOP CODERS',
                topClansTitle: 'TOP CLANS PVP',
                clansHvhTitle: 'TOP CLANS HVH',
                hvhTitle: 'TOP HVH',
                aimTitle: 'TOP AIM PLAYERS',
                tabHome: 'Home',
                tabNews: 'FTAP News'
            }
        };

        function updateUILanguage() {
            const t = translations[currentLang];
            document.getElementById('siteTitle').innerText = t.siteTitle;
            document.getElementById('siteSubhead').innerText = t.siteSubhead;
            document.getElementById('gamepassesTitle').innerHTML = t.gamepassesTitle;
            document.getElementById('allTimeTopTitle').innerHTML = t.allTimeTopTitle;
            document.getElementById('topCisTitle').innerHTML = t.topCisTitle;
            document.getElementById('topCodersTitle').innerHTML = t.topCodersTitle;
            document.getElementById('topClansTitle').innerHTML = t.topClansTitle;
            
            const clansHvhTitle = document.getElementById('clansHvhTitle');
            if (clansHvhTitle) clansHvhTitle.innerHTML = t.clansHvhTitle;
            const hvhTitle = document.getElementById('hvhTitle');
            if (hvhTitle) hvhTitle.innerHTML = t.hvhTitle;
            const aimTitle = document.getElementById('aimTitle');
            if (aimTitle) aimTitle.innerHTML = t.aimTitle;
            
            const tabHome = document.getElementById('tabHome');
            const tabNews = document.getElementById('tabNews');
            if (tabHome) tabHome.innerText = t.tabHome;
            if (tabNews) tabNews.innerText = t.tabNews;
            
            renderTopCoders();
            renderTopClans();
            renderClansHvh();
            renderHvh();
            renderAim();
            updateNewsMessage();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            const activeTabContent = document.getElementById(tabId);
            if (activeTabContent) activeTabContent.classList.add('active');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeButton = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
            if (activeButton) activeButton.classList.add('active');
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tabId = btn.getAttribute('data-tab');
                if (tabId) switchTab(tabId);
            });
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLang = btn.getAttribute('data-lang');
                updateUILanguage();
            });
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        const discordLink = document.getElementById('discordLink');
        if (discordLink) {
            discordLink.addEventListener('click', (e) => {
                e.preventDefault();
                window.open('https://discord.gg/ZE4Sr8ebV', '_blank');
            });
        }

        renderGamepasses();
        renderAllTimeTop();
        renderTopCis();
        renderTopCoders();
        renderTopClans();
        renderClansHvh();
        renderHvh();
        renderAim();
        updateUILanguage();
    })();
</script>
</body>
</html>
