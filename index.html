<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTAP CIS Community — PvP Clans & Gamepasses</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            line-height: 1.5;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .discord-banner {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #6d28d9;
            border-radius: 40px;
            padding: 0.7rem 2rem;
            box-shadow: 0 4px 25px rgba(109, 40, 217, 0.5);
            z-index: 1001;
            font-size: 0.9rem;
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
            transition: transform 0.4s ease;
            cursor: pointer;
            border: 1px solid #a855f7;
        }

        .discord-banner.show {
            transform: translateX(-50%) translateY(0);
        }

        .discord-banner a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(2px);
            border-radius: 1.5rem;
            padding: 2rem;
            margin-top: 90px;
            border: 1px solid rgba(139, 92, 246, 0.5);
            position: relative;
            z-index: 10;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        .lang-switch {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .lang-btn {
            background: rgba(109, 40, 217, 0.5);
            border: 1px solid #a855f7;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            cursor: pointer;
            color: #ffffff;
            transition: 0.2s;
            font-weight: 600;
        }

        .lang-btn.active {
            background: #6d28d9;
            border-color: #c084fc;
            color: white;
            box-shadow: 0 0 10px #6d28d9;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #c084fc, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(109, 40, 217, 0.3);
        }

        .subhead {
            color: #d1d5db;
            border-left: 3px solid #8b5cf6;
            padding-left: 1rem;
            margin: 1rem 0 2rem 0;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #6d28d9;
            padding-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #8b5cf6;
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: #6d28d9;
            border-color: #c084fc;
            color: white;
            box-shadow: 0 0 15px #6d28d9;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 700;
            margin: 1.5rem 0 1rem 0;
            letter-spacing: -0.3px;
            border-left: 4px solid #8b5cf6;
            padding-left: 0.8rem;
        }

        .gamepass-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }

        .gamepass-item {
            background: rgba(109, 40, 217, 0.25);
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid #8b5cf6;
            transition: 0.2s;
        }

        .gamepass-item:hover {
            background: rgba(109, 40, 217, 0.45);
            border-color: #c084fc;
            transform: translateY(-2px);
        }

        .gamepass-name {
            font-weight: 800;
            font-size: 1rem;
            display: block;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .gamepass-price {
            color: #c084fc;
            font-size: 0.9rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            display: inline-block;
        }

        .top-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin: 1rem 0;
        }

        .top-item {
            display: flex;
            align-items: center;
            padding: 0.7rem 1rem;
            background: rgba(109, 40, 217, 0.2);
            border-radius: 0.8rem;
            flex-wrap: wrap;
            border: 1px solid #6d28d9;
        }

        .top-rank {
            font-weight: 800;
            color: #c084fc;
            width: 50px;
            font-size: 1rem;
        }

        .top-name {
            font-weight: 700;
            color: #ffffff;
            flex: 1;
            font-size: 1rem;
        }

        .top-status {
            color: #e2e8f0;
            font-size: 0.8rem;
            line-height: 1.45;
            background: rgba(0, 0, 0, 0.6);
            padding: 0.3rem 0.7rem;
            border-radius: 1rem;
            margin-top: 0.2rem;
            width: 100%;
            word-break: break-word;
            white-space: normal;
        }

        .clan-info {
            color: #ffffff;
            font-size: 0.85rem;
            background: rgba(109, 40, 217, 0.4);
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-weight: 500;
        }

        .news-message {
            background: rgba(109, 40, 217, 0.2);
            border: 1px solid #8b5cf6;
            border-radius: 1.2rem;
            padding: 2rem;
            text-align: center;
            margin: 1rem 0;
        }

        .news-message p {
            font-size: 1.1rem;
            color: #e2e8f0;
            margin-bottom: 0.8rem;
        }

        .news-message .lazy-sign {
            font-style: italic;
            color: #c084fc;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #a78bfa;
            border-top: 1px solid #6d28d9;
            padding-top: 1.5rem;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
                margin-top: 80px;
            }
            .top-rank {
                width: 40px;
            }
            .discord-banner {
                white-space: normal;
                font-size: 0.7rem;
                padding: 0.4rem 1rem;
                width: 90%;
            }
            .top-status {
                margin-top: 6px;
            }
            .top-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .news-message p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

<canvas id="spaceCanvas"></canvas>

<div class="discord-banner" id="discordBanner">
    <a href="#" id="discordLink">Official Discord Server FTAP</a>
</div>

<div class="container">
    <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru">Русский</button>
        <button class="lang-btn" data-lang="en">English</button>
    </div>

    <h1 id="siteTitle">FTAP Community</h1>
    <div class="subhead" id="siteSubhead">All-Time Tops · Gamepasses · PvP Clans · News</div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="home" id="tabHome">Главная</button>
        <button class="tab-btn" data-tab="news" id="tabNews">News / Новости</button>
    </div>

    <div id="home" class="tab-content active">
        <h2 id="gamepassesTitle">GAMEPASSES</h2>
        <div class="gamepass-grid" id="gamepassGrid"></div>

        <h2 id="allTimeTopTitle">ALL-TIME TOP</h2>
        <div class="top-list" id="allTimeTopList"></div>

        <h2 id="topCisTitle">TOP CIS RIGHT NOW</h2>
        <div class="top-list" id="topCisList"></div>

        <h2 id="topCodersTitle">TOP CODERS</h2>
        <div class="top-list" id="topCodersList"></div>

        <h2 id="topClansTitle">TOP CLANS PVP</h2>
        <div class="top-list" id="topClansList"></div>
    </div>

    <div id="news" class="tab-content">
        <div class="news-message" id="newsMessage">
            <p id="newsText">Пока я не делал посты в сайте так как кто я? Правильно ленивая жопа.</p>
            <div class="lazy-sign" id="lazySignature">Усердно какаю</div>
        </div>
    </div>

    <footer id="footerText">FTAP CIS Community — PvP & News Hub</footer>
</div>

<script>
    (function() {
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        let particles = [];
        const particleCount = 350;
        let stars = [];

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function initSpace() {
            particles = [];
            stars = [];
            for (let i = 0; i < 1000; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2 + 0.5,
                    alpha: Math.random() * 0.6 + 0.2,
                    twinkleSpeed: 0.005 + Math.random() * 0.02,
                    twinkleDir: Math.random() > 0.5 ? 1 : -1
                });
            }
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 0.2,
                    speedY: (Math.random() - 0.5) * 0.15,
                    alpha: Math.random() * 0.4 + 0.1,
                    color: `hsl(${260 + Math.random() * 80}, 80%, 55%)`
                });
            }
        }

        function drawSpace() {
            ctx.clearRect(0, 0, width, height);
            const grad = ctx.createLinearGradient(0, 0, width, height);
            grad.addColorStop(0, '#05030a');
            grad.addColorStop(0.5, '#0c0820');
            grad.addColorStop(1, '#140c2a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
            
            for (let star of stars) {
                star.alpha += star.twinkleSpeed * star.twinkleDir;
                if (star.alpha > 0.7) star.twinkleDir = -1;
                if (star.alpha < 0.15) star.twinkleDir = 1;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 240, 200, ${star.alpha})`;
                ctx.fill();
            }
            
            for (let p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#7c3aed';
                ctx.fill();
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x > width) p.x = 0;
                if (p.x < 0) p.x = width;
                if (p.y > height) p.y = 0;
                if (p.y < 0) p.y = height;
            }
            ctx.shadowBlur = 0;
            requestAnimationFrame(drawSpace);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initSpace();
        });
        resizeCanvas();
        initSpace();
        drawSpace();

        let currentLang = 'ru';

        const gamepassesList = [
            { name: "Farther Reach", price: "225 Robux" },
            { name: "Multi-Color Line", price: "45 Robux" },
            { name: "Escape Faster", price: "135 Robux" },
            { name: "Infinite House Time", price: "60 Robux" },
            { name: "More House Saves", price: "60 Robux" },
            { name: "Raised Toys Limit", price: "225 Robux" },
            { name: "Earn More Coins", price: "225 Robux" }
        ];

        const allTimeTop = ["Markakela", "Keenawareeness", "Lal", "Reflex", "Rellizeez", "Welosew", "Flintex", "Meow", "Lensor", "Drezz", "Derealization", "Centurion"];
        const topCisPlayers = ["LortFaeky", "Krot", "Reflex", "Rellizeez", "Welosew"];
        
        const topCoders = [
            { name: "m1kp", statusRu: "m1kp (ешка) создал всеми известный скрипт Worst — топ-1 скрипт по мнению опытных кодеров.", statusEn: "m1kp created Worst script — top-rated by pro coders." },
            { name: "Blizt", statusRu: "Blizt — создатель скрипта Blizt. Есть премиум и бесплатная версия. У бесплатной сокращён функционал, но для новичков подходит.", statusEn: "Blizt script author. Premium & free version — good for beginners." },
            { name: "Tapalka", statusRu: "Опытный разработчик на Python, LuaU, Go, Java и C#. ", statusEn: "Experienced developer: Python, LuaU, Go, Java, C#." },
            { name: "marshel", statusRu: "Маршел — создатель качественного скрипта Resonance.", statusEn: "Marshel — creator of Resonance script. " },
            { name: "Sladostrastnik", statusRu: "Грек, очень опытный скриптер (LuaU, Python). Лидер SEB - EGA.", statusEn: "Greek scripter, expert in LuaU/Python. Leader of SEB - EGA." }
        ];

        const pvpClans = [
            { name: "SHX", infoRu: "1 место. Клан имеет сильнейших на данный момент игроков LortFaeky, Krot.", infoEn: "1st place. Absolute PvP leaders: LortFaeky, Krot." },
            { name: "KoJ", infoRu: "2 место. Клан имеет фтаперов снг: Desper, Centurion, Derealization.", infoEn: "2nd place. CIS elite: Desper, Centurion, Derealization." },
            { name: "DIN", infoRu: "3 место. Именно этот клан может доставить вам неприятности ведь у них есть сильные игроки.", infoEn: "3rd place. This clan has strong players who can cause trouble." }
        ];

        function renderGamepasses() {
            const container = document.getElementById('gamepassGrid');
            if (!container) return;
            container.innerHTML = gamepassesList.map(gp => `
                <div class="gamepass-item">
                    <span class="gamepass-name">${escapeHtml(gp.name)}</span>
                    <span class="gamepass-price">${escapeHtml(gp.price)}</span>
                </div>
            `).join('');
        }

        function renderAllTimeTop() {
            const container = document.getElementById('allTimeTopList');
            if (!container) return;
            container.innerHTML = allTimeTop.map((p, i) => `<div class="top-item"><div class="top-rank">${i+1}</div><div class="top-name">${escapeHtml(p)}</div></div>`).join('');
        }
        function renderTopCis() {
            const container = document.getElementById('topCisList');
            if (!container) return;
            container.innerHTML = topCisPlayers.map((p, i) => `<div class="top-item"><div class="top-rank">${i+1}</div><div class="top-name">${escapeHtml(p)}</div></div>`).join('');
        }
        function renderTopCoders() {
            const container = document.getElementById('topCodersList');
            if (!container) return;
            container.innerHTML = topCoders.map((c, i) => `
                <div class="top-item">
                    <div class="top-rank">${i+1}</div>
                    <div class="top-name">${escapeHtml(c.name)}</div>
                    <div class="top-status">${currentLang === 'ru' ? c.statusRu : c.statusEn}</div>
                </div>
            `).join('');
        }

        function renderTopClans() {
            const container = document.getElementById('topClansList');
            if (!container) return;
            container.innerHTML = pvpClans.map((clan, idx) => `
                <div class="top-item">
                    <div class="top-rank">${idx+1}</div>
                    <div class="top-name">${escapeHtml(clan.name)}</div>
                    <div class="clan-info">${currentLang === 'ru' ? clan.infoRu : clan.infoEn}</div>
                </div>
            `).join('');
        }

        function updateNewsLanguage() {
            const newsTextEl = document.getElementById('newsText');
            const lazySignEl = document.getElementById('lazySignature');
            if (!newsTextEl) return;
            
            if (currentLang === 'ru') {
                newsTextEl.innerHTML = 'Пока я не делал посты в сайте так как кто я? Правильно ленивая жопа.';
                lazySignEl.textContent = 'Очень усердно какаю.';
            } else {
                newsTextEl.innerHTML = ' No news yet because the author is a little bit lazy and doesn\'t want to do anything.';
                lazySignEl.textContent = '— Lazy author';
            }
        }

        const translations = {
            ru: {
                siteTitle: 'FTAP CIS Community',
                siteSubhead: 'All-Time Tops · Gamepasses · PvP Clans · News',
                gamepassesTitle: 'GAMEPASSES',
                allTimeTopTitle: 'ALL-TIME TOP',
                topCisTitle: 'TOP CIS RIGHT NOW',
                topCodersTitle: 'TOP CODERS',
                topClansTitle: 'TOP CLANS PVP',
                footerText: 'FTAP CIS Community — PvP & News Hub',
                tabHome: 'Главная',
                tabNews: 'Новости'
            },
            en: {
                siteTitle: 'FTAP CIS Community',
                siteSubhead: 'All-Time Tops · Gamepasses · PvP Clans · News',
                gamepassesTitle: 'GAMEPASSES',
                allTimeTopTitle: 'ALL-TIME TOP',
                topCisTitle: 'TOP CIS RIGHT NOW',
                topCodersTitle: 'TOP CODERS',
                topClansTitle: 'TOP CLANS PVP',
                footerText: 'FTAP CIS Community — PvP & News Hub',
                tabHome: 'Main',
                tabNews: 'News'
            }
        };

        function updateUILanguage() {
            const t = translations[currentLang];
            document.getElementById('siteTitle').textContent = t.siteTitle;
            document.getElementById('siteSubhead').textContent = t.siteSubhead;
            document.getElementById('gamepassesTitle').innerHTML = t.gamepassesTitle;
            document.getElementById('allTimeTopTitle').innerHTML = t.allTimeTopTitle;
            document.getElementById('topCisTitle').innerHTML = t.topCisTitle;
            document.getElementById('topCodersTitle').innerHTML = t.topCodersTitle;
            document.getElementById('topClansTitle').innerHTML = t.topClansTitle;
            document.getElementById('footerText').textContent = t.footerText;
            
            const tabHomeBtn = document.getElementById('tabHome');
            const tabNewsBtn = document.getElementById('tabNews');
            if (tabHomeBtn) tabHomeBtn.textContent = t.tabHome;
            if (tabNewsBtn) tabNewsBtn.textContent = t.tabNews;

            renderTopCoders();
            renderTopClans();
            updateNewsLanguage();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            const activeContent = document.getElementById(tabId);
            if (activeContent) activeContent.classList.add('active');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeBtn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
            if (activeBtn) activeBtn.classList.add('active');
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.dataset.tab;
                switchTab(tabId);
            });
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLang = btn.dataset.lang;
                updateUILanguage();
            });
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, (m) => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
        }

        const banner = document.getElementById('discordBanner');
        setTimeout(() => banner.classList.add('show'), 500);
        const discordLink = document.getElementById('discordLink');
        if (discordLink) {
            discordLink.addEventListener('click', (e) => {
                e.preventDefault();
                window.open('https://discord.gg/ZE4Sr8ebV', '_blank');
            });
        }

        renderGamepasses();
        renderAllTimeTop();
        renderTopCis();
        renderTopCoders();
        renderTopClans();
        updateUILanguage();
    })();
</script>
</body>
</html>
